name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: GabrielSantana013

          # 🖤 fundo preto (ESSENCIAL pra esse visual)
          background_color: "#000000"

          # 🐍 cobrinha verde
          color_snake: "#2ecc71"

          # 🎨 níveis dos commits (do mais fraco ao mais forte)
          # grid quase invisível → commits destacados
          color_dots: "#111111,#1b1b1b,#2ecc71,#9b59b6,#bb6bd9"

          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
