name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # roda 1x por dia (UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate github-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: GabrielSantana013

          # 🐍 cor da cobrinha (verde)
          color_snake: "#2ecc71"

          # 🟣 cor dos commits (quando a cobrinha passa)
          color_commits: "#9b59b6"

          # ⬛ quadradinhos do grid (todos pretos)
          color_dots: "#000000,#000000,#000000,#000000,#000000"

          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
